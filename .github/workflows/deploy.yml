name: ABH Preview Branch Checks

on:
  push:
    branches:
      - feature/abh-monthly-enrollment
  pull_request:
    branches:
      - feature/abh-monthly-enrollment
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abh-preview-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ABH feature branch (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: test -s dist/index.html

      - name: Confirm validation-only workflow
        run: echo "Checks completed. This workflow does not deploy to any server."
