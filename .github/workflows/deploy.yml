
name: FieldPulse Deployment

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldpulse-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build frontend and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify frontend build
        run: test -s dist/index.html

      - name: Upload frontend (dist/) to document root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: dist/
          server-dir: ./
          state-name: .ftp-deploy-sync-state-frontend.json
          dangerous-clean-slate: false

      - name: Upload PHP entry points (public_html/) to document root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: public_html/
          server-dir: ./
          state-name: .ftp-deploy-sync-state-public-html.json
          dangerous-clean-slate: false

      - name: Upload application code (private_storage/)
        if: ${{ vars.DEPLOY_PRIVATE_STORAGE == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: private_storage/
          server-dir: ${{ vars.PRIVATE_STORAGE_SERVER_DIR }}
          state-name: .ftp-deploy-sync-state-private-storage.json
          dangerous-clean-slate: false
          exclude: |
            .env
            .env.*
            fieldpulse/
            logs/
            *.log
