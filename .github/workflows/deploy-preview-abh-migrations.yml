name: ABH Preview Migration Catalog Upload

on:
  workflow_dispatch:
    inputs:
      confirm_preview_abh_migrations_upload:
        description: "Upload the 11 reviewed ABH SQL migration files to preview private storage only; does not execute SQL"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: abh-preview-migration-catalog-upload
  cancel-in-progress: false

jobs:
  upload_preview_abh_migrations:
    name: Upload ABH migration catalog to preview only
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/feature/abh-monthly-enrollment' &&
      inputs.confirm_preview_abh_migrations_upload == true &&
      vars.ABH_PREVIEW_DEPLOY_ENABLED == 'false' &&
      vars.ABH_PREVIEW_DRY_RUN == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: abh-preview
      url: https://monthlyperformancepreview.abhglobalinformationtechnologysolutions.com.ng
    steps:
      - name: Check out the approved feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/abh-monthly-enrollment

      - name: Verify and stage only the ABH migration catalog
        shell: bash
        run: |
          set -euo pipefail
          test -d private_storage/abh_migrations
          count=$(find private_storage/abh_migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sql' | wc -l)
          test "$count" -eq 11
          test -z "$(find private_storage/abh_migrations -type l -print -quit)"
          while IFS= read -r -d '' file; do
            test -s "$file"
            grep -qE '^[[:space:]]*(CREATE|ALTER|INSERT|UPDATE|DELETE|DROP|RENAME|SET|--|/\*)' "$file"
          done < <(find private_storage/abh_migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sql' -print0)
          mkdir -p deploy/preview-private/abh_migrations
          cp private_storage/abh_migrations/[0-9][0-9][0-9]_*.sql deploy/preview-private/abh_migrations/
          staged=$(find deploy/preview-private/abh_migrations -maxdepth 1 -type f -name '*.sql' | wc -l)
          test "$staged" -eq 11
          echo "Verified and staged $staged ABH SQL catalog files. No SQL was executed."

      - name: Verify dedicated preview private FTPS destination
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.ABH_PREVIEW_PRIVATE_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.ABH_PREVIEW_PRIVATE_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.ABH_PREVIEW_PRIVATE_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          [[ "$FTP_SERVER" == "nano.yahmis.com" ]]
          [[ "$FTP_USERNAME" == "abhpreview_private@monthlyperformancepreview.abhglobalinformationtechnologysolutions.com.ng" ]]

      - name: Upload only ABH migration catalog to preview private storage
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.ABH_PREVIEW_PRIVATE_FTP_SERVER }}
          username: ${{ secrets.ABH_PREVIEW_PRIVATE_FTP_USERNAME }}
          password: ${{ secrets.ABH_PREVIEW_PRIVATE_FTP_PASSWORD }}
          port: ${{ vars.ABH_PREVIEW_FTP_PORT || '21' }}
          protocol: ftps
          security: strict
          local-dir: deploy/preview-private/
          server-dir: ./abh_migrations/
          state-name: .ftp-deploy-sync-state-abh-migrations.json
          dangerous-clean-slate: false
          dry-run: false
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/.env.*
            **/*.log
