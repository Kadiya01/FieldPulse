<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="FieldPulse">
  <!--
    FieldPulse mark.

    A rounded blue tile with a white pulse trace across it: the app records a
    count in the field and the server verifies it afterwards, so the mark is the
    measurement rather than a generic bolt.

    Deliberately hand-written rather than exported from a design tool. The same
    geometry is drawn by private_storage/bin/brand_assets.php for the PNG icons,
    and the two only stay recognisable if both come from one description — which
    is the reason the colours are named once here instead of being sampled back
    out of an existing image.

    Colours: blue-600 (#2563eb), the same value as `theme_color` in
    vite.config.ts and the header background, on the gray-100 (#f3f4f6) the app
    paints its pages.
  -->
  <rect width="512" height="512" rx="112" fill="#2563eb" />

  <!--
    One path, not several: a single subpath keeps the joins round and continuous
    all the way across the tile, which is what makes it still legible at the 16px
    a browser tab shows.
  -->
  <path
    d="M96 288h72l40-96 56 168 40-108 28 68h44"
    fill="none"
    stroke="#ffffff"
    stroke-width="40"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>