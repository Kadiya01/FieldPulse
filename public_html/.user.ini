; ---------------------------------------------------------------------------
; FieldPulse — PHP runtime limits for the API
;
; .htaccess cannot set these, and the defaults on a shared host are often far
; too small for a 5 MB phone photo: PHP's default post_max_size is 8M but
; upload_max_filesize is commonly 2M, and memory_limit 128M will not hold a
; 40-megapixel decode.
;
; Must be named `.user.ini` to be picked up, and only works on hosts running
; PHP-FPM or LiteSpeed with CGI/FastCGI. On mod_php it is ignored — set the same
; values in the host's php.ini or a custom .htaccess php_value block instead.
;
; These MUST agree with MAX_UPLOAD_BYTES in .env. If PHP rejects an upload before
; the application sees it, the client gets a generic 500 rather than the 413
; FILE_TOO_LARGE the API contract promises, which is a bad failure mode to debug
; from a phone. See docs/DEPLOYMENT.md §Troubleshooting.
; ---------------------------------------------------------------------------

; 6M: 5 MB payload plus multipart overhead. Keep the headroom modest — a much
; larger ceiling only widens the DoS surface, and MAX_UPLOAD_BYTES is what
; actually enforces the contract.
upload_max_filesize = 6M
post_max_size = 6M

; A 40 MP decode in GD needs roughly width*height*4 bytes for the source plus
; the same again for the 32x32 thumbnail, so 128M is the floor and 256M is
; comfortable. This is the single most common cause of a verification job
; dying with "Allowed memory size exhausted" on shared hosting.
memory_limit = 256M

; Every request is small JSON or a single-part upload; generous timeouts just
; tie up a worker process that other tenants share.
max_execution_time = 60
max_input_time = 60

; Nothing here shells out or opens a socket, so the function surface can stay
; tight. exec/system are absent from the default list, and this makes that
; explicit rather than incidental.
; (disable_functions is PHP_INI_SYSTEM on most builds and cannot be set here.)

; Real error reporting belongs in the log, not in the response body. display_errors
; off plus log_errors on is what keeps a stack trace out of a JSON API.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Session use is nil: the app authenticates with a JWT and a refresh cookie, not
; PHP sessions. Starting the session handler would leave a writable temp file per
; request for no benefit.
session.auto_start = 0
